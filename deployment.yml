apiVersion: apps/v1
kind: Deployment
metadata:
  name: plain-java-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plain-java-app
  template:
    metadata:
      labels:
        app: plain-java-app
    spec:
      containers:
      - name: java-app
        image: plain-java-hello:latest
        imagePullPolicy: Never # Uses the image built locally on your machine
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: plain-java-service
spec:
  selector:
    app: plain-java-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: NodePort